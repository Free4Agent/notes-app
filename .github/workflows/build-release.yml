name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For uploading release assets
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew :androidApp:assembleDebug
      
    - name: Build Release APK (unsigned)
      run: ./gradlew :androidApp:assembleRelease
      
    - name: Sign Release APK
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: androidApp/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
      continue-on-error: true  # Don't fail if signing secrets not set
      
    - name: Rename APKs with version
      run: |
        VERSION=${{ github.ref_name }}
        VERSION=${VERSION#v}  # Remove 'v' prefix if present
        if [ "$VERSION" = "${{ github.ref_name }}" ]; then
          VERSION=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)
        fi
        
        mkdir -p apk-output
        
        # Debug APK
        cp androidApp/build/outputs/apk/debug/*.apk apk-output/notes-app-${VERSION}-debug.apk
        
        # Release APK (signed or unsigned)
        if [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" apk-output/notes-app-${VERSION}.apk
        else
          cp androidApp/build/outputs/apk/release/*.apk apk-output/notes-app-${VERSION}-unsigned.apk
        fi
        
        echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV
        
    - name: Upload APKs as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apk-files
        path: apk-output/*.apk
        retention-days: 30
        
    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: apk-output/*.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create/Update "Latest" Pre-release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        name: Latest Build
        tag_name: latest
        prerelease: true
        body: |
          This is an automated build from the main branch.
          
          ## Installation
          
          ### Obtainium
          Add this repo URL to Obtainium for automatic updates.
          
          ### Manual
          Download the APK and install it on your Android device.
          
          **Note:** Debug builds are unsigned and for testing only.
        files: apk-output/*-debug.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
