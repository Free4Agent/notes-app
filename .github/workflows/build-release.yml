name: Build Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew :androidApp:assembleDebug --no-daemon
      
    - name: Build Release APK
      run: ./gradlew :androidApp:assembleRelease --no-daemon
      
    - name: Sign Release APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: androidApp/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
      continue-on-error: true
      
    - name: Rename APKs
      run: |
        mkdir -p release-apks
        cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release-apks/notes-app-debug-${{ github.ref_name }}.apk
        if [ -f androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk ]; then
          cp androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk release-apks/notes-app-release-${{ github.ref_name }}-unsigned.apk
        fi
        if [ -f ${{ steps.sign_app.outputs.signedReleaseFile }} ]; then
          cp ${{ steps.sign_app.outputs.signedReleaseFile }} release-apks/notes-app-release-${{ github.ref_name }}.apk
        fi
        ls -la release-apks/
    
    - name: Upload APKs to Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-apks/*.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload APKs as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apk-files-${{ github.ref_name }}
        path: release-apks/*.apk
