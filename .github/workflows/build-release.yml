name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For uploading release assets
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Check if Android app exists
      id: check_android
      run: |
        if [ -f "androidApp/build.gradle.kts" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      
    - name: Build Debug APK
      if: steps.check_android.outputs.exists == 'true'
      run: |
        ./gradlew :androidApp:assembleDebug
        echo "Debug build completed, listing outputs:"
        ls -la androidApp/build/outputs/apk/debug/ || echo "Debug output dir not found"
      
    - name: Build Release APK
      if: steps.check_android.outputs.exists == 'true'
      run: |
        ./gradlew :androidApp:assembleRelease
        echo "Release build completed, listing outputs:"
        ls -la androidApp/build/outputs/apk/release/ || echo "Release output dir not found"
      
    - name: Sign Release APK
      if: steps.check_android.outputs.exists == 'true' && startsWith(github.ref, 'refs/tags/v')
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: androidApp/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
      continue-on-error: true
      
    - name: Prepare APKs
      id: prepare
      run: |
        VERSION=${{ github.ref_name }}
        VERSION=${VERSION#v}
        if [ "$VERSION" = "${{ github.ref_name }}" ]; then
          VERSION=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)
        fi
        
        mkdir -p apk-output
        
        # Debug: Show all APK files found
        echo "Looking for APK files..."
        find . -name "*.apk" -type f 2>/dev/null || echo "No APKs found"
        
        # Copy any APK found
        FOUND_APK=false
        for apk in $(find . -name "*.apk" -type f 2>/dev/null); do
          echo "Found: $apk"
          if [[ "$apk" == *"debug"* ]]; then
            cp "$apk" apk-output/notes-app-${VERSION}-debug.apk
            echo "debug_apk=true" >> $GITHUB_OUTPUT
            FOUND_APK=true
          elif [[ "$apk" == *"release"* ]] || [[ "$apk" == *"signed"* ]]; then
            cp "$apk" apk-output/notes-app-${VERSION}.apk
            echo "release_apk=true" >> $GITHUB_OUTPUT
            FOUND_APK=true
          fi
        done
        
        if [ "$FOUND_APK" = false ]; then
          echo "No APK files found!"
        fi
        
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        ls -la apk-output/ || echo "apk-output directory empty"
        
    - name: Upload APKs as Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apk-files-${{ steps.prepare.outputs.version || 'unknown' }}
        path: apk-output/*.apk
        retention-days: 30
        if-no-files-found: warn
        
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
        files: apk-output/*.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
        
    - name: Create/Update "Latest" Pre-release
      if: github.ref == 'refs/heads/main' && (steps.prepare.outputs.debug_apk == 'true' || steps.prepare.outputs.release_apk == 'true')
      uses: softprops/action-gh-release@v1
      with:
        name: Latest Build
        tag_name: latest
        prerelease: true
        body: |
          This is an automated build from the main branch.
          
          ## Installation
          
          ### Obtainium
          Add this repo URL to Obtainium for automatic updates.
          
          ### Manual
          Download the APK and install it on your Android device.
          
          **Note:** Debug builds are for testing only.
        files: apk-output/*-debug.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
      
    - name: Report Status
      if: always()
      run: |
        if [ "${{ steps.prepare.outputs.debug_apk }}" == "true" ] || [ "${{ steps.prepare.outputs.release_apk }}" == "true" ]; then
          echo "✅ APKs built successfully"
        else
          echo "⚠️ No APKs were built - project may still be in scaffold phase"
        fi
