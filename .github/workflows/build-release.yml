name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For uploading release assets
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Check if Android app exists
      id: check_android
      run: |
        if [ -f "androidApp/build.gradle.kts" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      
    - name: Build Debug APK
      if: steps.check_android.outputs.exists == 'true'
      run: |
        ./gradlew :androidApp:assembleDebug || echo "Build failed - project may not be ready"
      continue-on-error: true
      
    - name: Build Release APK
      if: steps.check_android.outputs.exists == 'true'
      run: |
        ./gradlew :androidApp:assembleRelease || echo "Build failed - project may not be ready"
      continue-on-error: true
      
    - name: Sign Release APK
      if: steps.check_android.outputs.exists == 'true' && startsWith(github.ref, 'refs/tags/v')
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: androidApp/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
      continue-on-error: true
      
    - name: Prepare APKs
      id: prepare
      run: |
        VERSION=${{ github.ref_name }}
        VERSION=${VERSION#v}  # Remove 'v' prefix if present
        if [ "$VERSION" = "${{ github.ref_name }}" ]; then
          VERSION=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)
        fi
        
        mkdir -p apk-output
        
        # Check if APKs were built
        if [ -f "androidApp/build/outputs/apk/debug/androidApp-debug.apk" ]; then
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk apk-output/notes-app-${VERSION}-debug.apk
          echo "debug_apk=true" >> $GITHUB_OUTPUT
        fi
        
        if [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" apk-output/notes-app-${VERSION}.apk
          echo "release_apk=true" >> $GITHUB_OUTPUT
        elif [ -f "androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk" ]; then
          cp androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk apk-output/notes-app-${VERSION}-unsigned.apk
          echo "release_apk=true" >> $GITHUB_OUTPUT
        fi
        
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        
    - name: Upload APKs as Artifacts
      if: steps.prepare.outputs.debug_apk == 'true' || steps.prepare.outputs.release_apk == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: apk-files-${{ steps.prepare.outputs.version }}
        path: apk-output/*.apk
        retention-days: 30
        
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/v') && (steps.prepare.outputs.debug_apk == 'true' || steps.prepare.outputs.release_apk == 'true')
      uses: softprops/action-gh-release@v1
      with:
        files: apk-output/*.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create/Update "Latest" Pre-release
      if: github.ref == 'refs/heads/main' && (steps.prepare.outputs.debug_apk == 'true' || steps.prepare.outputs.release_apk == 'true')
      uses: softprops/action-gh-release@v1
      with:
        name: Latest Build
        tag_name: latest
        prerelease: true
        body: |
          This is an automated build from the main branch.
          
          ## Installation
          
          ### Obtainium
          Add this repo URL to Obtainium for automatic updates.
          
          ### Manual
          Download the APK and install it on your Android device.
          
          **Note:** Debug builds are for testing only.
        files: apk-output/*-debug.apk
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
      
    - name: Report Status
      if: always()
      run: |
        if [ "${{ steps.prepare.outputs.debug_apk }}" == "true" ] || [ "${{ steps.prepare.outputs.release_apk }}" == "true" ]; then
          echo "✅ APKs built successfully"
        else
          echo "⚠️ No APKs were built - project may still be in scaffold phase"
        fi
